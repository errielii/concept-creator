<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">

<title>Concept Creator</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Orbitron:wght@600;700;800;900&display=swap');

*{
  box-sizing:border-box;
}

:root{
  --bg:#020d17;
  --panel:#06121e;
  --line:#1c3040;
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  min-height:100vh;
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  padding:0;
}

#app{
  width:100%;
  max-width:1100px;
  padding:0 16px 40px;
}

/* =========================
   TITLE
========================= */

#styleTitle{
  position:relative;

  margin:0;
  padding-top:0;

  height:125px;

  display:flex;
  justify-content:center;
  align-items:flex-start;

  font-family:Arial,sans-serif;
  font-size:72px;
  line-height:1;

  font-weight:700;
  font-style:normal;

  color:#aaa5ff;

  -webkit-text-stroke:2px #080812;

  text-shadow:
    0 3px 0 #29255c,
    0 6px 8px #000;

  z-index:20;
}

#styleTitle::after{
  content:"";

  position:absolute;

  width:440px;
  max-width:70%;

  height:3px;

  left:50%;
  bottom:28px;

  transform:translateX(-50%);

  background:linear-gradient(
    90deg,
    transparent,
    #53606a,
    #a5afb6,
    #53606a,
    transparent
  );

  box-shadow:0 1px 5px #000;
}

#styleTitle::before{
  content:none !important;
}

/* =========================
   TITLE MODES
========================= */

#styleTitle.title-gradient{
  font-family:Arial,sans-serif !important;

  font-size:72px;

  font-weight:700 !important;
  font-style:normal !important;

  background:linear-gradient(
    180deg,
    #e0ddff 0%,
    #a9a4ff 48%,
    #7169d5 100%
  );

  -webkit-background-clip:text;
  background-clip:text;

  -webkit-text-fill-color:transparent;

  -webkit-text-stroke:2px #090817;

  text-shadow:none;
}

#styleTitle.title-custom-gradient{
  background:linear-gradient(
    to bottom,
    var(--title-top,#dcd9ff),
    var(--title-bottom,#6d65cf)
  );

  -webkit-background-clip:text;
  background-clip:text;

  -webkit-text-fill-color:transparent;

  -webkit-text-stroke:2px #090817;

  text-shadow:none;
}

/* ULTRA */

#styleTitle.title-ultra{
  font-family:'Orbitron',Arial,sans-serif !important;

  font-size:72px;

  font-weight:900 !important;

  font-style:italic !important;

  letter-spacing:2px;

  color:#dcd9ff;

  -webkit-text-stroke:2px #090817;

  text-shadow:
    0 3px 0 #29255c,
    0 6px 8px #000,
    0 0 14px rgba(150,120,255,.35);
}

/* =========================
   STATS GRID
========================= */

#grid{
  width:100%;
  max-width:800px;

  margin:0 auto;

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  column-gap:8px;
  row-gap:7px;

  align-items:start;
}

/* =========================
   STAT BOX
========================= */

.box{
  --color:#fff000;

  position:relative;

  height:40px;
  width:100%;

  min-width:0;

  overflow:hidden;

  background:#020a11;

  border:2px solid var(--color);

  border-radius:10px;

  cursor:grab;

  user-select:none;
  -webkit-user-select:none;

  touch-action:none;

  box-shadow:
    inset 0 0 0 1px #000,
    0 1px 2px #000;
}

/* =========================
   STAT FILL
========================= */

.fill{
  position:absolute;

  left:5px;
  top:5px;
  bottom:5px;

  width:0;

  max-width:calc(100% - 10px);

  border-radius:6px;

  background:var(--color);

  z-index:2;

  pointer-events:none;
}

/* =========================
   STAT NAME
========================= */

.name{
  position:absolute;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  z-index:3;

  padding:0 12px;

  /*
    FONTE CORRIGIDA
  */

  font-family:'Roboto Condensed',Arial,sans-serif !important;

  font-size:24px;

  line-height:1;

  font-weight:700;

  font-style:italic !important;

  color:#fff;

  -webkit-text-stroke:1px #000;

  text-shadow:none;

  pointer-events:none;
}

/* =========================
   RAINBOW
========================= */

.unused-rainbow{
  background:linear-gradient(
    90deg,
    #ff0000,
    #ff7a00,
    #fff000,
    #25ff00,
    #00d9ff,
    #396cff,
    #9d39ff,
    #ff00d9,
    #ff0000
  );

  background-size:250% 100%;

  animation:statRainbow 2.5s linear infinite;
}

@keyframes statRainbow{
  to{
    background-position:250% 0;
  }
}

/* =========================
   RAINBOW BORDER
========================= */

.box.rainbow-border{
  border-color:transparent !important;
  background:#020a11 !important;
}

.box.rainbow-border::before{
  content:"";

  position:absolute;

  inset:-2px;

  border-radius:11px;

  background:linear-gradient(
    90deg,
    #ff0000,
    #ff7a00,
    #fff000,
    #25ff00,
    #00d9ff,
    #396cff,
    #9d39ff,
    #ff00d9
  );

  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);

  -webkit-mask-composite:xor;

  mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);

  mask-composite:exclude;

  padding:2px;

  pointer-events:none;

  z-index:4;
}

.box.rainbow-border .fill,
.box.rainbow-border .name{
  z-index:5;
}

.box.rainbow-border .fill,
.box[data-rainbow="true"] .fill{
  background:linear-gradient(
    90deg,
    #ff0000,
    #ff7a00,
    #fff000,
    #25ff00,
    #00d9ff,
    #396cff,
    #9d39ff,
    #ff00d9
  ) !important;

  background-size:100% 100% !important;

  background-repeat:no-repeat !important;

  animation:none !important;
}

/* =========================
   REMOVE
========================= */

.remove{
  display:none;

  position:absolute;

  right:-30px;
  top:50%;

  transform:translateY(-50%);

  z-index:10;

  width:22px;
  height:22px;

  padding:0;

  border:0;

  border-radius:50%;

  background:#000c;

  color:#fff;

  font:700 14px Arial;

  cursor:pointer;
}

.box:hover .remove,
#app.editing-touch .remove{
  display:block;
}

#app.exporting .remove{
  display:none !important;
}

/* =========================
   CONTROLS
========================= */

#controls{
  width:min(820px,100%);

  margin:28px auto 0;

  padding:14px;

  background:#06121e;

  border:1px solid #1b2b3b;

  border-radius:12px;
}

.row{
  display:flex;

  align-items:center;

  gap:8px;

  flex-wrap:wrap;

  margin-bottom:8px;
}

input,
button{
  min-height:36px;

  padding:7px 11px;

  border:1px solid #304255;

  border-radius:8px;

  background:#0a1623;

  color:#fff;

  font-family:Arial,sans-serif;

  outline:none;
}

input[type=text]{
  flex:1;
  min-width:150px;
}

input[type=number]{
  width:78px;
}

input[type=color]{
  width:46px !important;
  min-width:46px;

  height:36px;

  padding:3px;
}

button{
  cursor:pointer;
}

button:hover{
  background:#111f2e;
}

#rainbowMode.active{
  background:#ff00d9;
  border-color:#ff00d9;
}

.colorControl{
  display:flex;

  align-items:center;

  gap:7px;

  min-height:36px;

  padding:0 4px;

  font-size:12px;

  font-weight:700;
}

.small{
  font-size:12px;
  color:#8e9aaa;
}

/* =========================
   DRAGGING
========================= */

.dragging,
.dragging *{
  user-select:none !important;
  -webkit-user-select:none !important;
}

/* =========================
   EXPORT
========================= */

#app.exporting .box{
  background:rgba(2,10,17,.70) !important;
}

#app.exporting .box::after{
  content:"";

  position:absolute;

  left:5px;
  right:5px;

  bottom:5px;

  height:65%;

  border-radius:6px;

  background:linear-gradient(
    180deg,
    rgba(255,255,255,0),
    rgba(255,255,255,.08)
  );

  pointer-events:none;

  z-index:1;
}

#app.exporting .fill{
  max-width:calc(100% - 10px) !important;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px),(pointer:coarse){

  body{
    padding:0;
  }

  #app{
    padding:0 10px 30px;
  }

  #styleTitle{
    height:105px;
    font-size:52px;
  }

  #styleTitle::after{
    width:300px;
    bottom:22px;
  }

  #grid{
    width:100%;

    grid-template-columns:
      repeat(2,minmax(0,1fr)) !important;

    column-gap:8px;
    row-gap:8px;
  }

  .box{
    height:40px;
    border-radius:9px;
  }

  .fill{
    left:5px;
    top:5px;
    bottom:5px;

    width:0;

    max-width:calc(100% - 10px);

    border-radius:6px;
  }

  .name{
    font-size:22px;

    font-style:italic !important;

    -webkit-text-stroke:1px #000;

    text-shadow:none;
  }

  .remove{
    display:block;
    right:-26px;
  }

  #controls{
    margin-top:22px;
  }

  input[type=number]{
    width:100px;
  }
}
</style>
</head>

<body>

<div id="app">

  <h1 id="styleTitle">Name</h1>

  <div id="grid"></div>

  <div id="controls">

    <div class="row">
      <input
        id="styleName"
        type="text"
        placeholder="Style name"
      >

      <button id="applyName">
        Apply name
      </button>

      <button id="gradientName">
        Ultra
      </button>
    </div>

    <div class="row">

      <div class="colorControl">
        <span>Title</span>

        <input
          id="titleColor"
          type="color"
          value="#aaa5ff"
        >
      </div>

      <div class="colorControl">

        <span>Gradient</span>

        <input
          id="titleGradientTop"
          type="color"
          value="#dcd9ff"
        >

        <input
          id="titleGradientBottom"
          type="color"
          value="#6d65cf"
        >

        <button id="titleGradient">
          Apply
        </button>

      </div>

    </div>

    <div class="row">

      <input
        id="statName"
        type="text"
        placeholder="Stat name"
      >

      <input
        id="statValue"
        type="number"
        min="0"
        max="10"
        step="0.1"
        value="5"
      >

      <button id="add">
        Add stat
      </button>

    </div>

    <div class="row">

      <button id="zero">
        Set all 0
      </button>

      <button id="ten">
        Set all 10
      </button>

      <button id="clear">
        Clear
      </button>

      <button id="rainbowMode">
        Rainbow
      </button>

      <button id="savePng">
        Save PNG
      </button>

    </div>

    <div
      id="rainbowHint"
      class="small"
    >
      Click Rainbow, then click a stat
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>

const grid =
  document.getElementById('grid');

const app =
  document.getElementById('app');

let dragging = null;
let rainbowMode = false;


/* =========================
   COLORS
========================= */

function color(v){

  if(v >= 10)
    return '#ff00d9';

  if(v >= 8)
    return '#25ff00';

  if(v >= 5)
    return '#fff000';

  if(v >= 2)
    return '#ff7a00';

  return '#ff0000';
}


/* =========================
   UPDATE
========================= */

function update(box){

  const v =
    Math.max(
      0,
      Math.min(
        10,
        Number(box.dataset.value) || 0
      )
    );

  const c = color(v);

  box.style.setProperty(
    '--color',
    c
  );

  const fill =
    box.querySelector('.fill');

  if(!fill)
    return;

  const rainbow =
    box.dataset.rainbow === 'true';

  box.classList.toggle(
    'rainbow-border',
    rainbow
  );

  fill.style.background =
    rainbow
      ? 'linear-gradient(90deg,#ff0000,#ff7a00,#fff000,#25ff00,#00d9ff,#396cff,#9d39ff,#ff00d9)'
      : c;


  /*
    AGORA A BARRA PODE CHEGAR
    ATÉ O FINAL DO STAT.

    Antes tinha * 0.8,
    então 10 só preenchia 80%.
  */

  const available =
    Math.max(
      0,
      box.clientWidth - 10
    );

  const fillWidth =
    Math.min(
      available,
      available * (v / 10)
    );

  fill.style.left =
    '5px';

  fill.style.width =
    fillWidth + 'px';

  fill.style.maxWidth =
    available + 'px';

  fill.style.right =
    'auto';

  fill.style.top =
    '5px';

  fill.style.bottom =
    '5px';
}


/* =========================
   ADD BOX
========================= */

function addBox(
  name,
  value = 5
){

  const box =
    document.createElement('div');

  box.className =
    'box';

  box.dataset.name =
    name;

  box.dataset.value =
    Math.max(
      0,
      Math.min(
        10,
        Number(value) || 5
      )
    );

  box.dataset.rainbow =
    'false';


  const fill =
    document.createElement('div');

  fill.className =
    'fill';


  const text =
    document.createElement('div');

  text.className =
    'name';

  text.textContent =
    name;


  const remove =
    document.createElement('button');

  remove.className =
    'remove';

  remove.textContent =
    '×';

  remove.title =
    'Remove stat';


  remove.onclick = e => {

    e.stopPropagation();

    box.remove();
  };


  box.append(
    fill,
    text,
    remove
  );


  grid.appendChild(box);

  update(box);


  /* =========================
     DRAG
  ========================= */

  box.addEventListener(
    'pointerdown',
    e => {

      if(
        e.target === remove ||
        rainbowMode
      ){
        return;
      }

      e.preventDefault();

      dragging =
        box;

      app.classList.add(
        'dragging'
      );

      box.style.cursor =
        'grabbing';

      try{

        box.setPointerCapture(
          e.pointerId
        );

      }catch(_){}

      setValue(e);
    }
  );


  box.addEventListener(
    'pointermove',
    e => {

      if(
        dragging === box
      ){

        e.preventDefault();

        setValue(e);
      }
    }
  );


  const stop = () => {

    if(
      dragging === box
    ){

      dragging = null;

      app.classList.remove(
        'dragging'
      );

      box.style.cursor =
        'grab';
    }
  };


  box.addEventListener(
    'pointerup',
    stop
  );

  box.addEventListener(
    'pointercancel',
    stop
  );
}


/* =========================
   SET VALUE
========================= */

function setValue(e){

  if(!dragging)
    return;

  const r =
    dragging.getBoundingClientRect();

  const v =
    Math.max(
      0,
      Math.min(
        10,
        ((e.clientX - r.left) / r.width) * 10
      )
    );

  dragging.dataset.value =
    v;

  update(dragging);
}


document.addEventListener(
  'pointerup',
  () => {

    dragging = null;

    app.classList.remove(
      'dragging'
    );

  }
);


/* =========================
   TITLE
========================= */

document.getElementById(
  'applyName'
).onclick = () => {

  const value =
    document.getElementById(
      'styleName'
    ).value.trim();

  document.getElementById(
    'styleTitle'
  ).textContent =
    value || 'Name';
};


/* =========================
   TITLE COLOR
========================= */

document.getElementById(
  'titleColor'
).oninput = e => {

  const title =
    document.getElementById(
      'styleTitle'
    );

  title.classList.remove(
    'title-gradient',
    'title-custom-gradient',
    'title-ultra'
  );

  title.style.color =
    e.target.value || '#fff';

  title.style.webkitTextFillColor =
    '';

  title.style.webkitTextStroke =
    '2px #000';

  title.style.textShadow =
    '0 3px 0 #29255c,0 6px 8px #000';
};


/* =========================
   ULTRA
========================= */

document.getElementById(
  'gradientName'
).onclick = () => {

  const title =
    document.getElementById(
      'styleTitle'
    );

  title.classList.remove(
    'title-gradient',
    'title-custom-gradient'
  );

  title.classList.toggle(
    'title-ultra'
  );
};


/* =========================
   TITLE GRADIENT
========================= */

const titleGradient =
  document.getElementById(
    'titleGradient'
  );

const titleGradientTop =
  document.getElementById(
    'titleGradientTop'
  );

const titleGradientBottom =
  document.getElementById(
    'titleGradientBottom'
  );


titleGradient.onclick = () => {

  const title =
    document.getElementById(
      'styleTitle'
    );

  title.classList.remove(
    'title-gradient',
    'title-ultra'
  );

  title.classList.toggle(
    'title-custom-gradient'
  );

  title.style.setProperty(
    '--title-top',
    titleGradientTop.value
  );

  title.style.setProperty(
    '--title-bottom',
    titleGradientBottom.value
  );
};


[
  titleGradientTop,
  titleGradientBottom

].forEach(input => {

  input.oninput = () => {

    const title =
      document.getElementById(
        'styleTitle'
      );

    title.style.setProperty(
      '--title-top',
      titleGradientTop.value
    );

    title.style.setProperty(
      '--title-bottom',
      titleGradientBottom.value
    );
  };

});


/* =========================
   ADD STAT
========================= */

document.getElementById(
  'add'
).onclick = () => {

  const name =
    document.getElementById(
      'statName'
    ).value.trim()
    || 'NEW STAT';

  const value =
    document.getElementById(
      'statValue'
    ).value;

  addBox(
    name,
    value
  );

  document.getElementById(
    'statName'
  ).value = '';

  document.getElementById(
    'statValue'
  ).value = 5;
};


/* =========================
   RAINBOW
========================= */

const rainbowButton =
  document.getElementById(
    'rainbowMode'
  );

const rainbowHint =
  document.getElementById(
    'rainbowHint'
  );


rainbowButton.onclick = () => {

  rainbowMode =
    !rainbowMode;

  rainbowButton.classList.toggle(
    'active',
    rainbowMode
  );

  rainbowHint.textContent =
    rainbowMode
      ? 'Now click a stat to enable/disable Rainbow'
      : 'Click Rainbow, then click a stat';
};


grid.addEventListener(
  'click',
  e => {

    const box =
      e.target.closest('.box');

    if(
      !box ||
      e.target.closest('.remove') ||
      !rainbowMode
    ){
      return;
    }

    box.dataset.rainbow =
      box.dataset.rainbow === 'true'
        ? 'false'
        : 'true';

    update(box);
  }
);


/* =========================
   RESET
========================= */

document.getElementById(
  'zero'
).onclick = () => {

  [...grid.children].forEach(
    box => {

      box.dataset.value =
        0;

      update(box);
    }
  );
};


document.getElementById(
  'ten'
).onclick = () => {

  [...grid.children].forEach(
    box => {

      box.dataset.value =
        10;

      update(box);
    }
  );
};


document.getElementById(
  'clear'
).onclick = () => {

  grid.innerHTML =
    '';
};


/* =========================
   FILE NAME
========================= */

function exportFileName(ext){

  const style =
    (
      document.getElementById(
        'styleName'
      ).value.trim()

      ||

      document.getElementById(
        'styleTitle'
      ).textContent.trim()

      ||

      'Name'
    )
    .replace(
      /[\\/:*?"<>|]/g,
      ''
    )
    .trim()
    || 'Name';

  return (
    style +
    ' - Concept.' +
    ext
  );
}


/* =========================
   SAVE PNG
========================= */

document.getElementById(
  'savePng'
).onclick = async () => {

  const button =
    document.getElementById(
      'savePng'
    );

  if(button.disabled)
    return;

  const oldText =
    button.textContent;

  button.disabled =
    true;

  button.textContent =
    'Saving...';

  let wrap = null;

  try{

    if(
      typeof html2canvas !==
      'function'
    ){

      throw new Error(
        'html2canvas missing'
      );
    }


    if(
      document.fonts &&
      document.fonts.ready
    ){

      await document.fonts.ready;
    }


    const gridRect =
      grid.getBoundingClientRect();

    const width =
      Math.round(
        gridRect.width
      );


    const stats =
      grid.cloneNode(true);


    stats
      .querySelectorAll(
        '.remove'
      )
      .forEach(
        x => x.remove()
      );


    const originals =
      [
        ...grid.querySelectorAll(
          '.box'
        )
      ];

    const clones =
      [
        ...stats.querySelectorAll(
          '.box'
        )
      ];


    originals.forEach(
      (original,index) => {

        const clone =
          clones[index];

        if(!clone)
          return;


        const v =
          Math.max(
            0,
            Math.min(
              10,
              Number(
                original.dataset.value
              ) || 0
            )
          );


        const available =
          Math.max(
            0,
            original.clientWidth - 10
          );


        /* CORRIGIDO: chega até 100% */

        const fillWidth =
          Math.min(
            available,
            available *
            (v / 10)
          );


        const cloneFill =
          clone.querySelector(
            '.fill'
          );


        if(!cloneFill)
          return;


        cloneFill.style.left =
          '5px';

        cloneFill.style.width =
          fillWidth + 'px';

        cloneFill.style.maxWidth =
          available + 'px';

        cloneFill.style.right =
          'auto';

        cloneFill.style.top =
          '5px';

        cloneFill.style.bottom =
          '5px';
      }
    );


    /* =========================
       EXPORT CONTAINER
    ========================= */

    wrap =
      document.createElement(
        'div'
      );

    wrap.style.position =
      'absolute';

    wrap.style.left =
      '-100000px';

    wrap.style.top =
      '0';

    wrap.style.width =
      width + 'px';

    wrap.style.padding =
      '0';

    wrap.style.margin =
      '0';

    wrap.style.background =
      'transparent';

    wrap.style.overflow =
      'visible';


    wrap.appendChild(
      stats
    );

    document.body.appendChild(
      wrap
    );


    app.classList.add(
      'exporting'
    );


    const scale =
      3;


    const statsCanvas =
      await html2canvas(
        wrap,
        {
          backgroundColor:null,
          scale:scale,
          useCORS:true,
          allowTaint:true,
          logging:false
        }
      );


    app.classList.remove(
      'exporting'
    );


    /* =========================
       TITLE
    ========================= */

    const title =
      document.getElementById(
        'styleTitle'
      );

    const titleText =
      title.textContent ||
      'Name';

    const cs =
      getComputedStyle(
        title
      );


    const originalFontSize =
      parseFloat(
        cs.fontSize
      ) || 64;


    const scaledFontSize =
      Math.round(
        originalFontSize *
        scale
      );


    const titleH =
      Math.round(
        scaledFontSize *
        1.5
      );


    /* =========================
       FINAL CANVAS
    ========================= */

    const out =
      document.createElement(
        'canvas'
      );

    out.width =
      statsCanvas.width;

    out.height =
      statsCanvas.height +
      titleH;


    const ctx =
      out.getContext('2d');


    ctx.clearRect(
      0,
      0,
      out.width,
      out.height
    );


    /* =========================
       TITLE
    ========================= */

    ctx.save();

    ctx.textAlign =
      'center';

    ctx.textBaseline =
      'middle';


    const fontFamily =
      cs.fontFamily ||
      'Arial';


    const fontWeight =
      cs.fontWeight ||
      '700';


    const fontStyle =
      cs.fontStyle ||
      'normal';


    ctx.font =
      fontStyle +
      ' ' +
      fontWeight +
      ' ' +
      scaledFontSize +
      'px ' +
      fontFamily;


    ctx.lineJoin =
      'round';


    const isGradient =
      title.classList.contains(
        'title-gradient'
      ) ||

      title.classList.contains(
        'title-custom-gradient'
      );


    const centerY =
      titleH / 2;


    if(
      title.classList.contains(
        'title-custom-gradient'
      )
    ){

      const top =
        cs.getPropertyValue(
          '--title-top'
        ).trim()
        || '#dcd9ff';


      const bottom =
        cs.getPropertyValue(
          '--title-bottom'
        ).trim()
        || '#6d65cf';


      const g =
        ctx.createLinearGradient(
          0,
          centerY -
            scaledFontSize / 2,
          0,
          centerY +
            scaledFontSize / 2
        );


      g.addColorStop(
        0,
        top
      );

      g.addColorStop(
        1,
        bottom
      );


      ctx.fillStyle =
        g;

    }else if(
      title.classList.contains(
        'title-gradient'
      )
    ){

      const g =
        ctx.createLinearGradient(
          0,
          0,
          out.width,
          0
        );

      g.addColorStop(
        0,
        '#ff0000'
      );

      g.addColorStop(
        .14,
        '#ff7a00'
      );

      g.addColorStop(
        .28,
        '#fff000'
      );

      g.addColorStop(
        .42,
        '#25ff00'
      );

      g.addColorStop(
        .56,
        '#00d9ff'
      );

      g.addColorStop(
        .70,
        '#396cff'
      );

      g.addColorStop(
        .84,
        '#9d39ff'
      );

      g.addColorStop(
        1,
        '#ff00d9'
      );


      ctx.fillStyle =
        g;

    }else{

      ctx.fillStyle =
        cs.color ||
        '#ffffff';
    }


    ctx.lineWidth =
      2 * scale;

    ctx.strokeStyle =
      '#000000';

    ctx.strokeText(
      titleText,
      out.width / 2,
      centerY
    );


    ctx.fillText(
      titleText,
      out.width / 2,
      centerY
    );


    ctx.restore();


    /* =========================
       STATS
    ========================= */

    ctx.drawImage(
      statsCanvas,
      0,
      titleH
    );


    /* =========================
       DOWNLOAD
    ========================= */

    const a =
      document.createElement(
        'a'
      );

    a.download =
      exportFileName(
        'png'
      );

    a.href =
      out.toDataURL(
        'image/png'
      );

    document.body.appendChild(
      a
    );

    a.click();

    a.remove();


  }catch(err){

    console.error(err);

    alert(
      'Could not save the image.'
    );

  }finally{

    app.classList.remove(
      'exporting'
    );

    if(wrap)
      wrap.remove();

    button.disabled =
      false;

    button.textContent =
      oldText;
  }
};


/* =========================
   DEFAULT STATS
========================= */

[
  'Block',
  'Bump',
  'Dive',
  'Jump',
  'Serve',
  'Set',
  'Speed',
  'Spike'
].forEach(
  x => addBox(x,5)
);


/* =========================
   RESIZE
========================= */

window.addEventListener(
  'resize',
  () => {

    [...grid.children]
      .forEach(
        update
      );

  }
);

</script>

</body>
</html>
